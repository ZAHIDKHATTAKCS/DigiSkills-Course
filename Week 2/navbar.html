<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        *{
            font-size:1.5rem;
            color:rgb(178, 16, 72)
        }
        .navbar{
            display:flex;
            background:lightgray;
            justify-content:space-between;
            align-items:center;
            height: 100px;
            padding-inline: 20px;
            font-weight: bold;
        }
        .container{
            display:flex;
            justify-content:space-between;
            align-items:center;
            width:50%;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="home">logo</div>
        <div class="container">
            <div class="nav-item">Home</div>
            <div class="nav-item">About</div>
            <div class="nav-item">Services</div>
            <div class="nav-item">Contact</div>
        </div>
    </div>
</body>
</html>
