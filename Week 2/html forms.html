<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
</head>
<body>
    <form>

        <!-- email -->
        <label>email</label>
        <input type="email" required placeholder="Enter your email" maxlength="10" minlength="4" />

        <br /><br />
        <!-- username -->
        <label>Username</label>
        <input type="text" required placeholder="Enter your username" />

        <br /><br />


        <!-- age -->
        <label>Age</label>
        <input type="number" required placeholder="Enter your age" />

        <br /><br />

        <!-- Password -->
        <label>Password</label>
        <input type="password" required placeholder="Enter your password" />

        <br /><br />


        <!-- date -->
        <label>Date</label>
        <input type="date" />

        <br /><br />


        <!-- gender -->
        <label>Gender</label>
        <input type="radio" />

        <br /><br />


        <!-- textarea -->
        <label>Message</label>
        <textarea></textarea>


        <br /><br />

        
        <!-- submit button -->
        <input type="submit" value="Submit" />
    </form>
</body>
</html>
