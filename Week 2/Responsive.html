<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive website</title>
    <style>
        img{
            width:100%;
        }

        .card{
                border:2px solid red;
            }

            /* media  */
        @media (min-width: 768px) {
            body{
                background-color:lightblue;
            }
            .container{
                display:flex;
                gap: 20px;
            }
            
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- card 1 -->
        <div class="card">
            <img src="https://picsum.photos/300/200?1" alt="Laptop">
            <h2>Laptop</h2>
            <p>Powerful Laptop for Developers</p>
        </div>

        <!-- card 2 -->
        <div class="card">
            <img src="https://picsum.photos/300/200?2" alt="Laptop">
            <h2>Phone</h2>
            <p>Latest Smartphone with Advanced Features</p>
        </div>

        <!-- card 3 -->
        <div class="card">
            <img src="https://picsum.photos/300/200?3" alt="Laptop">
            <h2>Tablets</h2>
            <p>Latest Tablets with Advanced Features</p>
        </div>

    </div>
</body>
</html>
