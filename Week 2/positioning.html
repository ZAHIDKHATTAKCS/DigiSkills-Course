<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning</title>
    <style>
        .parent{
            position:relative;
            width:300px;
            height:200px;
            background:lightgray;
        }
        .child{
            position:absolute;
            top:20px;
            right:20px;
            width:80px;
            height:80px;
            background:red;
            color:white;
            padding:10px;
        }
        .fixed-btn{
            position:fixed;
            bottom:20px;
            right:20px;
            width:80px;
            height:80px;
            background:blue;
            color:white;
            padding:10px;
            text-align:center; 
        }
    </style>
</head>
<body>
    <div class="parent">
        parent
        <div class="child">child</div>
    </div>
    <div class="fixed-btn">Help</div>
</body>
</html>
