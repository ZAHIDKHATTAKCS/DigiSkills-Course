<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        *{
            font-size:1.5rem;
        }
        .box1{
            width:200px;
            height:100px;
            background:tomato;
            margin-bottom:10px;
        }
        .box2{
            width:50%;
            height:100px;
            background:skyblue;
            margin-bottom:10px;
        }
        h1{
            font-size:2rem;
        }
        .hero{
            height:100vh;
            background:lightgreen;
            text-align:center;
        }
    </style>
</head>
<body>
    <h1>css Units examples</h1>
    <div class="box1">2px width</div>
    <div class="box2">50% width</div>
    <div class="hero">100vh height</div>
</body>
</html>
